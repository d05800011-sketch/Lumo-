<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1117">
  <title>Lumo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Экран входа -->
  <main id="auth-screen" class="screen" hidden>
    <form id="auth-form" class="auth-card" autocomplete="on">
      <div class="logo"><span class="logo-dot"></span>Lumo</div>
      <p class="tagline">Мессенджер, который светится изнутри</p>

      <label id="username-field" hidden>
        Имя пользователя
        <input id="username" type="text" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" placeholder="например, alex_77" autocomplete="username">
      </label>
      <label>
        Email
        <input id="email" type="email" required placeholder="you@example.com" autocomplete="email">
      </label>
      <label>
        Пароль
        <input id="password" type="password" required minlength="6" placeholder="не короче 6 символов" autocomplete="current-password">
      </label>

      <p id="auth-error" class="error" role="alert" hidden></p>
      <p id="auth-info" class="info" hidden></p>

      <button id="auth-submit" type="submit" class="btn primary">Войти</button>
      <button id="auth-toggle" type="button" class="btn link">Нет аккаунта? Зарегистрироваться</button>
    </form>
  </main>

  <!-- Экран настройки (если не заполнен config.js) -->
  <main id="setup-screen" class="screen" hidden>
    <div class="auth-card">
      <div class="logo"><span class="logo-dot"></span>Lumo</div>
      <h2>Осталось подключить базу</h2>
      <p>Скопируйте <code>config.example.js</code> в <code>config.js</code> и впишите данные вашего проекта Supabase. Подробности в README.</p>
    </div>
  </main>

  <!-- Основное приложение -->
  <div id="app" class="app" hidden>
    <aside id="sidebar" class="sidebar">
      <header class="sidebar-head">
        <div class="logo small"><span class="logo-dot"></span>Lumo</div>
        <div class="me">
          <span id="me-name" class="me-name"></span>
          <button id="logout" class="icon-btn" title="Выйти" aria-label="Выйти">⎋</button>
        </div>
      </header>

      <form id="new-chat-form" class="new-chat">
        <input id="new-chat-username" type="text" placeholder="Написать пользователю…" autocomplete="off" aria-label="Имя пользователя">
        <button class="btn primary small" type="submit" aria-label="Начать чат">＋</button>
      </form>
      <p id="new-chat-error" class="error small-text" hidden></p>

      <ul id="chat-list" class="chat-list"></ul>
      <p id="chat-empty" class="empty" hidden>Пока нет чатов. Введите имя пользователя выше, чтобы начать.</p>
    </aside>

    <section id="chat-pane" class="chat-pane">
      <div id="chat-placeholder" class="placeholder">
        <div class="logo-dot big"></div>
        <p>Выберите чат слева или начните новый</p>
      </div>

      <div id="chat-view" class="chat-view" hidden>
        <header class="chat-head">
          <button id="back" class="icon-btn back" aria-label="Назад к чатам">←</button>
          <div class="avatar" id="chat-avatar"></div>
          <div id="chat-title" class="chat-title"></div>
        </header>

        <div id="messages" class="messages" aria-live="polite"></div>

        <form id="composer" class="composer" autocomplete="off">
          <input id="message-input" type="text" maxlength="4000" placeholder="Сообщение" aria-label="Сообщение">
          <button class="btn primary" type="submit">Отправить</button>
        </form>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js" onerror="window.LUMO_CONFIG_MISSING = true"></script>
  <script src="app.js"></script>
</body>
</html>
